# Production: docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: vistaland

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: vistaland
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vistaland"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: "50060"
      MIGRATIONS_DIR: ./migrations
      MEDIA_DIR: /app/media
      # Caddy is the only hop in front of the API, so req.ip is the real client.
      TRUST_PROXY_HOPS: "1"
      PUBLIC_BASE_URL: https://${DOMAIN:?set DOMAIN}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/vistaland
      API_SECRET_KEY: ${API_SECRET_KEY:?set API_SECRET_KEY}
      VLES_API_KEY: ${VLES_API_KEY:-}
      VLES_SYNC_INTERVAL_MS: ${VLES_SYNC_INTERVAL_MS:-900000}
      CHAKRA_PLUGIN_ID: ${CHAKRA_PLUGIN_ID:-}
      CHAKRA_ACCESS_TOKEN: ${CHAKRA_ACCESS_TOKEN:-}
      CHAKRA_WEBHOOK_SECRET: ${CHAKRA_WEBHOOK_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MONI_MODEL: ${MONI_MODEL:-claude-opus-5-5}
      MONI_EFFORT: ${MONI_EFFORT:-medium}
      OUTBOUND_POLL_MS: ${OUTBOUND_POLL_MS:-60000}
      SUMMARY_REFRESH_MS: ${SUMMARY_REFRESH_MS:-600000}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@localhost}
      DASHBOARD_PUBLIC_URL: https://${DOMAIN:?set DOMAIN}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_NAME: ${SEED_ADMIN_NAME:-Admin}
    volumes:
      - media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    environment:
      API_INTERNAL_URL: http://api:50060
      API_SECRET_KEY: ${API_SECRET_KEY:?set API_SECRET_KEY}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_URL: https://${DOMAIN:?set DOMAIN}
      AUTH_TRUST_HOST: "true"
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - dashboard
    restart: unless-stopped

volumes:
  pgdata:
  media:
  caddy_data:
  caddy_config:
